[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stats_collect"
version = "0.1.0"
description = "통계 데이터 수집 — Korean local-government statistics extraction & panel-building automation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PublicDataReader>=1.1",
    "PyYAML>=6.0",
]

[project.scripts]
stats-collect = "stats_collect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
