[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-review"
version = "0.1.0"
description = "한·미 학술논문 선행연구(문헌검토) 비교 도구 (OpenAlex + Connected Papers + KCI 통합)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kwongyeo" }]
dependencies = [
    "pyalex>=0.21",
    "anthropic>=0.97",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lr-chat = "literature_review.cli:main"
lr-compare = "literature_review.compare:main"
lr-export = "literature_review.writing.export:main"
lr-outline = "literature_review.writing.outline:main"
lr-draft = "literature_review.writing.draft:main"
lr-build = "literature_review.writing.build:main"
lr-kci-proxy = "literature_review.web_proxy:main"
lr-run = "literature_review.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
