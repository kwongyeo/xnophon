[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jutamjuye"
version = "0.2.0"
description = "주탐주예(主探主豫) — 주식탐색과 주가예측: 한국·미국 주식 수익률 예측 연구 파이프라인 (가격·재무·거시·심리 통합)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kwongyeo" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=14",          # parquet
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "finance-datareader>=0.9",
    "pykrx>=1.0",
    "yfinance>=0.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyter", "matplotlib"]
deep = ["torch>=2.1"]       # LSTM/Transformer 사용 시

[project.scripts]
sp-pipeline = "stock_prediction.pipeline:main"
sp-poc = "stock_prediction.poc:main"
sp-baseline = "stock_prediction.baseline:main"
sp-stage2 = "stock_prediction.stage2:main"
sp-horizon = "stock_prediction.horizon_sweep:main"
sp-longshort = "stock_prediction.longshort:main"
sp-stage3 = "stock_prediction.stage3:main"
sp-regime = "stock_prediction.regime_strategy:main"
sp-neutral = "stock_prediction.neutral:main"
sp-final = "stock_prediction.capstone:main"
sp-sector = "stock_prediction.sector_neutral:main"
sp-stage4 = "stock_prediction.stage4:main"
sp-picks = "stock_prediction.picks:main"
sp-paper = "stock_prediction.paper_trade:main"
sp-notify = "stock_prediction.notify_telegram:main"
sp-refresh = "stock_prediction.refresh_data:main"

[tool.setuptools.packages.find]
where = ["src"]
